name: nomily_ios
options:
  bundleIdPrefix: com.nomily.app
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: minimal

packages:
  # Pinned to branch because Argon2Swift's transitive dep on
  # phc-winner-argon2 is itself branch-pinned, and SPM refuses to mix
  # version-pinned roots with branch-pinned transitive deps. The package
  # maintainer's own README uses `.branch("main")` for the same reason.
  Argon2Swift:
    url: https://github.com/tmthecoder/Argon2Swift.git
    branch: main

schemes:
  # Shared, so `xcodebuild -scheme nomily_ios` works from a clean checkout and
  # from CI. Without it Xcode only creates a *user* scheme the first time the
  # project is opened in the GUI, which left `-list` reporting zero schemes and
  # `-target` builds failing to resolve the SPM module map.
  nomily_ios:
    build:
      targets:
        nomily_ios: all
    run:
      config: Debug
    archive:
      config: Release

targets:
  nomily_ios:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
    resources:
      - path: Sources/Resources
    dependencies:
      - package: Argon2Swift
      # Embeds the watch app inside the iPhone app bundle, which is how a
      # watchOS companion ships — it can't be installed on its own.
      - target: nomily_watch
        embed: true
      # ★ 2026-10-21: the official PLAUD device SDKs (arm64 device builds,
      # v1.0.15 from github.com/Plaud-AI/plaud-sdk-public). They own the
      # Note Pro's encrypted BLE protocol (SN signature + RSA/ChaCha session)
      # that our own RecorderLink layer can't do without partner credentials.
      # `PlaudLink` (work in progress) wraps them behind `any RecorderLink`.
      - framework: Frameworks/PlaudBleSDK.framework
        embed: true
      - framework: Frameworks/PlaudDeviceBasicSDK.framework
        embed: true
      - framework: Frameworks/PlaudWiFiSDK.framework
        embed: true
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: Nomily AI
        CFBundleShortVersionString: "1.0.0"
        # Must track `nomily_watch`'s build number — watchOS refuses to install
        # a companion whose version doesn't match its host, and an embedded
        # watch app one build ahead is enough to trip it. Bump both or neither.
        CFBundleVersion: "99"
        # Skip Apple's per-upload "Missing Compliance" prompt. `false` is
        # appropriate when the app's crypto use is exempt from US export
        # documentation requirements:
        #   - HTTPS via URLSession (Azure / OpenAI / etc.) — built-in to iOS
        #   - Keychain storage — built-in to iOS
        #   - ChaCha20 + Argon2id used solely to encrypt/decrypt the user's
        #     own audio recordings (digital media content) at rest on a
        #     paired device the user owns — covered by the "ancillary"
        #     mass-market exemption and the EAR digital-media-protection
        #     carve-out.
        # If your legal review concludes the use is non-exempt, flip this
        # to `true` and file an annual self-classification (ERN) at
        # https://snap.bis.doc.gov.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: AccentColor
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSBluetoothAlwaysUsageDescription: Nomily AI connects to your D·NOTE recorder over Bluetooth to list, transfer and transcribe recordings.
        NSLocalNetworkUsageDescription: Nomily AI opens a direct TCP connection to your D·NOTE over its Wi-Fi access point during Fast Transfer.
        NSMicrophoneUsageDescription: Live transcription monitors microphone state to coordinate with the device's stream.
        # Scans the QR code the A1 extractor prints on a Mac. The only thing the camera is used
        # for — it is never opened elsewhere, and no frame is stored or sent anywhere.
        NSCameraUsageDescription: Nomily AI scans the QR code that carries a DingTalk A1 credential, so it never has to go through the clipboard.
        # ⛔ **Never remove this key.** `OnDeviceASR` / `OnDeviceLiveASR` link `Speech`, and the
        # first time `SFSpeechRecognizer.requestAuthorization` runs without this string in the
        # built Info.plist the system kills the process with a TCC namespace crash:
        #   "This app has crashed because it attempted to access privacy-sensitive data
        #    without a usage description. The app's Info.plist must contain an
        #    NSSpeechRecognitionUsageDescription key…"
        # `Sources/App/Info.plist` is *regenerated by xcodegen* from this file on every
        # `xcodegen generate`, so the key has to live here — adding it only to the generated
        # plist is silently reverted before the next build. The on-device recogniser runs
        # Apple's offline model; audio is not uploaded on this path.
        NSSpeechRecognitionUsageDescription: Nomily AI turns your recordings into text on this iPhone, using Apple's on-device speech recogniser. On that path the audio never leaves the device.
        # `nomily-a1://import/<base64url>` — the deep link behind that QR code, and behind any
        # tapped link. Handled in `NomilyApp.LocalizedRoot.onOpenURL`.
        CFBundleURLTypes:
          - CFBundleURLName: com.nomily.app.ios.a1
            CFBundleURLSchemes:
              - nomily-a1
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIBackgroundModes:
          - audio
          - bluetooth-central
    entitlements:
      path: Sources/App/nomily_ios.entitlements
      properties:
        com.apple.developer.networking.HotspotConfiguration: true
        # ⛔ **Deliberately NOT including** `com.apple.security.application-groups` (removed 2026-10-12).
        #
        # Two independent reasons, either one is enough:
        #
        # ① **It cannot be registered, and it also breaks Hotspot.** App Group IDs are **globally unique across teams**;
        #    `group.com.nomily.app` is already taken by the earlier personal team `YW24F9VMC9` on this machine.
        #    A failed registration makes Xcode fall back to a wildcard profile as a whole (`96S46YT5TP.*` does not include Hotspot),
        #    so the error also gains the line "doesn't include the Hotspot capability" --
        #    that is only a **side symptom**; the real cause is the App Group. (§3.1 records this investigation.)
        #
        # ② **It changes the data directory, effectively "hiding" the existing library.**
        #    `StorageLocations.root` is "use the group container if available, otherwise fall back to the sandbox".
        #    This app has **never** obtained the group container (it has always been the sandbox),
        #    so once this entitlement actually takes effect, `root` would switch from the sandbox Documents to the group container,
        #    and the user's library / config would **look completely empty** (the data is still in the sandbox, just no longer read).
        #
        # ## It is not needed at all right now
        # It is only a hook left so that "future share / notification / audio extensions" can share one container.
        # The watch pipeline does **not depend** on it -- the watch uses `WatchConnectivity`,
        # and the source list of `nomily_watch` does not include `StorageLocations.swift`.
        #
        # ## If it is really added in the future
        # Use a **team-unique** ID (e.g. `group.com.nomily.app.96S46YT5TP`, which already exists on the portal),
        # **and** add a one-time migration in `StorageLocations` (group container empty while the sandbox has data
        # → copy over), otherwise you get exactly the "library looks empty" problem in ② above.
        # Never use `group.com.nomily.app` again -- it is held by another team.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nomily.app
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # ★ Added 2026-10-12: **write the signing config into the spec**, for two reasons
        #   ① This file is the input of `xcodegen generate`, and **every generation rebuilds the pbxproj**
        #      -- the Team / signing style picked by hand in the GUI gets wiped, so it has to be clicked again after every generation.
        #   ② The `xcodebuild` automatic-signing path (the preferred branch of `tools/install-device.sh`)
        #      also needs these two values; putting them here avoids passing them on the command line again.
        # ⚠️ Change here when switching team/account (`project-nodevice.yml` has a copy too; change both together).
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 96S46YT5TP

  nomily_watch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Watch
      # Compiled into both apps so the WatchConnectivity wire contract, the
      # clip-naming convention and the localized strings can't drift apart.
      - path: Sources/Services/Watch/WatchLinkMessage.swift
      # Shared so the Action Button intent exists on both sides: the iPhone
      # needs it to author the shortcut, the watch needs it to run one.
      - path: Sources/Services/Watch/RecordingIntent.swift
      # ★ 2026-10-16 revision thirteen: the home-face **expression library**. Sharing it across both ends isn't to save code, it's
      # a correctness requirement — the picker in the iPhone settings needs to show previews, and the preview and the face actually
      # drawn on the watch must be **the same code**, otherwise the user picks a smiling eye on the phone
      # and finds a droopy one on raising the wrist. The asset sources and geometry parameters are written at the top of this file.
      - path: Sources/Services/Watch/BotFaceStyle.swift
      - path: Sources/Services/Storage/RecordingName.swift
      - path: Sources/App/L10n.swift
      # Runtime language switching. Compiled into the watch too (2026-10-15) so
      # the wrist can offer its own language picker: the strings and the ten
      # `.lproj` folders were already along for the ride, but without this file
      # there was no way to point `NSLocalizedString` at anything other than the
      # watch's system language. Nothing iPhone-specific lives here — it's the
      # `Bundle` subclass plus the tag table.
      - path: Sources/Services/Localization/AppLanguage.swift
      - path: Sources/Resources
        buildPhase: resources
    dependencies:
      # ★ 2026-10-16 revision eight: the Control Center quick-record control.
      # Its content is a Control Widget that only exists on watchOS 26 (for the reason see the top of
      # `WatchControls/NomilyWatchControls.swift`).
      # ⚠️ It must be embedded in the **watch App**, not in the iPhone App — watchOS extensions
      #    follow the App they belong to, and Apple specifies that "when both ends have an App, only the watch-side control
      #    is recognised by Control Center".
      - target: nomily_watch_controls
        embed: true
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Nomily AI
        CFBundleShortVersionString: "1.0.0"
        # Must track the iPhone app's build number — watchOS refuses to install
        # a companion whose version doesn't match its host.
        CFBundleVersion: "99"
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.nomily.app
        NSMicrophoneUsageDescription: Nomily AI records voice notes on your Apple Watch and syncs them to your iPhone.
        # ★ 2026-10-16 revision eleven: while recording the waveform follows the measured heart rate, so it needs to read heart rate.
        # ⚠️ The copy must make "read-only, not shared" clear: the HealthKit authorisation sheet shows this text to the user verbatim,
        #    and "why does a voice recorder need to read my heart rate" is the question the user will ask on the spot — the answer has to be in that sentence.
        #
        # ★★ 2026-10-16 revision fifteen: **this copy and the entitlement below are kept for now,
        #    but nowhere in the code requests it any more** (user: "do not go by the heart rate").
        #    Keeping them is **deliberate**: deleting the entitlement would change the App ID's capability set,
        #    which means another trip to the portal to re-sign the provisioning profile — all to gain "one less line of copy that never shows".
        #    ⚠️ Remember the cost: if it's ever really decided to drop HealthKit, this is **two places**
        #    （`NSHealthShareUsageDescription` + `com.apple.developer.healthkit`），
        #    and after deleting them the first build will fail because the provisioning profile is stale — that's expected behaviour.
        NSHealthShareUsageDescription: Nomily AI reads your current heart rate while recording, so the waveform on the watch face beats in time with your own pulse. It never reads any other health data and never leaves your devices.
        # ⚠️ Only `NSHealthShareUsageDescription` (read) is needed. **`NSHealthUpdateUsageDescription` is not written**
        #    — this App never writes to Health, and declaring it would only add a write permission to the authorisation sheet,
        #    and a user seeing "wants to write" would refuse outright.
        # Background audio on watchOS is UIBackgroundModes, same as iOS.
        # WKBackgroundModes is a different key — it names `WKExtendedRuntimeSession`
        # types (workout-processing, self-care, mindfulness, …) and does not
        # accept `audio`; WatchKit exports exactly one value symbol,
        # WKBackgroundModesWorkoutProcessingValue. Declaring an illegal value
        # there risks installd rejecting the bundle outright.
        UIBackgroundModes:
          - audio
    # ★ 2026-10-16 revision eleven: reading heart rate needs the HealthKit entitlement.
    #
    # ⚠️ Added to the **watch target**, not the iPhone: it's the App on the watch that actually reads heart rate,
    #    and the iPhone side never touches HealthKit once. Requesting it on the iPhone too would only give
    #    "this voice-recorder App wants to read my health data" one more inexplicable source.
    #
    # ⚠️ This changes the capability set of App ID `com.nomily.app.watchkitapp`, so
    #    `-allowProvisioningUpdates` has to go to the portal, enable HealthKit,
    #    and re-sign a watchOS provisioning profile. The first build will be slower; when it errors, look at this line first.
    entitlements:
      path: Watch/nomily_watch.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nomily.app.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        GENERATE_INFOPLIST_FILE: NO
        # Ship the watch app as a single binary. Xcode's Debug default splits
        # it into a stub + `.debug.dylib` + `__preview.dylib` for SwiftUI
        # previews (which this target doesn't use), and that layout has to
        # survive iOS handing the bundle to the watch — a path that reports
        # nothing but "This app could not be installed at this time" when it
        # doesn't. Not worth the risk for a feature we don't use.
        ENABLE_DEBUG_DYLIB: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # ★ 2026-10-12: together with `nomily_ios`, the signing config is written into the spec (reasons above).
        #   The watch needs a **different** watchOS profile (bundle id is
        #   `com.nomily.app.watchkitapp`, not `com.nomily.app`), but uses the **same team**.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 96S46YT5TP

  # ★ 2026-10-16 revision eight: the Control Center quick-record control (watchOS 26+).
  #
  # Why it must be a **separate target**: WidgetKit controls can only live in an app-extension,
  # there's no "write the control straight into the App target" route. And an extension isn't an App and can't install itself;
  # it gets onto the watch by being embedded from the `nomily_watch` side.
  #
  # ⚠️ The deployment target is 26.0, **not following** `nomily_watch`'s 10.0: the Control Widget set
  #    starts at 26.0 on the watch (the iOS side is 18.0; the same API is a whole major version later).
  #    Following 10.0 would mean "it won't pass the availability check at compile time / even forced through, the control won't appear on 25.x".
  #    Full reasoning at the top of `WatchControls/NomilyWatchControls.swift`.
  #
  # ⚠️ The bundle id must be a **child prefix** of `nomily_watch`'s (`…watchkitapp.controls`).
  #    If the extension's bundle id doesn't inherit the host's, installing on the watch gets refused outright by installd.
  nomily_watch_controls:
    type: app-extension
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: WatchControls
      # Reuse the Action Button's intent — the control's action is exactly it, and it can't be written without compiling it in.
      # Both ends' Apps also each compile a copy of this file; a fourth copy looks redundant, but `#if os(...)` already
      # separates the iPhone / watch differences cleanly and the content is identical. Extracting an SPM package to save one file isn't worth it.
      - path: Sources/Services/Watch/RecordingIntent.swift
      # Only those `.lproj`s: the control's name and description go through `LocalizedStringResource(key, defaultValue:)`,
      # and the key must be findable in **the extension's own bundle**, otherwise it silently falls back to the English default on a Chinese watch.
      # Deliberately excludes Assets.xcassets and the two web-page js/css files — the control is tinted by the system and needs no
      # asset catalogue, so those three files are just along for the ride.
      - path: Sources/Resources
        buildPhase: resources
        excludes:
          - "Assets.xcassets"
          - "*.js"
          - "*.css"
    info:
      path: WatchControls/Info.plist
      properties:
        CFBundleDisplayName: Nomily AI
        CFBundleShortVersionString: "1.0.0"
        # Must match the parent App — when an embedded binary's version numbers differ from the host's, watchOS
        # refuses to install the whole App.
        CFBundleVersion: "99"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nomily.app.watchkitapp.controls
        TARGETED_DEVICE_FAMILY: "4"
        WATCHOS_DEPLOYMENT_TARGET: "26.0"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_DEBUG_DYLIB: NO
        # The extension doesn't install on its own; it follows the watch App.
        SKIP_INSTALL: YES
        # The extension mustn't use APIs that are "only for Apps".
        APPLICATION_EXTENSION_API_ONLY: YES
        # ★ Used to pull "things that should only belong to the App" out of **shared source**. Currently only one place:
        #   `NomilyWatchShortcuts` in `RecordingIntent.swift` — App Shortcuts
        #   are only registered in the App; registering them again in the extension would give "Record with Nomily" a second source.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) NOMILY_WIDGET_EXTENSION"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 96S46YT5TP
