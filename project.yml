name: nomily_ios
options:
  bundleIdPrefix: com.nomily.app
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: minimal

packages:
  # Pinned to branch because Argon2Swift's transitive dep on
  # phc-winner-argon2 is itself branch-pinned, and SPM refuses to mix
  # version-pinned roots with branch-pinned transitive deps. The package
  # maintainer's own README uses `.branch("main")` for the same reason.
  Argon2Swift:
    url: https://github.com/tmthecoder/Argon2Swift.git
    branch: main

targets:
  nomily_ios:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
    resources:
      - path: Sources/Resources
    dependencies:
      - package: Argon2Swift
      # Embeds the watch app inside the iPhone app bundle, which is how a
      # watchOS companion ships — it can't be installed on its own.
      - target: nomily_watch
        embed: true
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: Nomily AI
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "3"
        # Skip Apple's per-upload "Missing Compliance" prompt. `false` is
        # appropriate when the app's crypto use is exempt from US export
        # documentation requirements:
        #   - HTTPS via URLSession (Azure / OpenAI / etc.) — built-in to iOS
        #   - Keychain storage — built-in to iOS
        #   - ChaCha20 + Argon2id used solely to encrypt/decrypt the user's
        #     own audio recordings (digital media content) at rest on a
        #     paired device the user owns — covered by the "ancillary"
        #     mass-market exemption and the EAR digital-media-protection
        #     carve-out.
        # If your legal review concludes the use is non-exempt, flip this
        # to `true` and file an annual self-classification (ERN) at
        # https://snap.bis.doc.gov.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: AccentColor
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSBluetoothAlwaysUsageDescription: Nomily AI connects to your D·NOTE recorder over Bluetooth to list, transfer and transcribe recordings.
        NSLocalNetworkUsageDescription: Nomily AI opens a direct TCP connection to your D·NOTE over its Wi-Fi access point during Fast Transfer.
        NSMicrophoneUsageDescription: Live transcription monitors microphone state to coordinate with the device's stream.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIBackgroundModes:
          - audio
          - bluetooth-central
    entitlements:
      path: Sources/App/nomily_ios.entitlements
      properties:
        com.apple.developer.networking.HotspotConfiguration: true
        com.apple.security.application-groups:
          - group.com.nomily.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nomily.app
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  nomily_watch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Watch
      # Compiled into both apps so the WatchConnectivity wire contract, the
      # clip-naming convention and the localized strings can't drift apart.
      - path: Sources/Services/Watch/WatchLinkMessage.swift
      # Shared so the Action Button intent exists on both sides: the iPhone
      # needs it to author the shortcut, the watch needs it to run one.
      - path: Sources/Services/Watch/RecordingIntent.swift
      - path: Sources/Services/Storage/RecordingName.swift
      - path: Sources/App/L10n.swift
      - path: Sources/Resources
        buildPhase: resources
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Nomily AI
        CFBundleShortVersionString: "1.0.0"
        # Must track the iPhone app's build number — watchOS refuses to install
        # a companion whose version doesn't match its host.
        CFBundleVersion: "3"
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.nomily.app
        NSMicrophoneUsageDescription: Nomily AI records voice notes on your Apple Watch and syncs them to your iPhone.
        # Background audio on watchOS is UIBackgroundModes, same as iOS.
        # WKBackgroundModes is a different key — it names `WKExtendedRuntimeSession`
        # types (workout-processing, self-care, mindfulness, …) and does not
        # accept `audio`; WatchKit exports exactly one value symbol,
        # WKBackgroundModesWorkoutProcessingValue. Declaring an illegal value
        # there risks installd rejecting the bundle outright.
        UIBackgroundModes:
          - audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nomily.app.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        GENERATE_INFOPLIST_FILE: NO
        # Ship the watch app as a single binary. Xcode's Debug default splits
        # it into a stub + `.debug.dylib` + `__preview.dylib` for SwiftUI
        # previews (which this target doesn't use), and that layout has to
        # survive iOS handing the bundle to the watch — a path that reports
        # nothing but "This app could not be installed at this time" when it
        # doesn't. Not worth the risk for a feature we don't use.
        ENABLE_DEBUG_DYLIB: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
