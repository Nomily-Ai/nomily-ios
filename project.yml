name: nomily_ios
options:
  bundleIdPrefix: com.nomily.app
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: minimal

packages:
  # Pinned to branch because Argon2Swift's transitive dep on
  # phc-winner-argon2 is itself branch-pinned, and SPM refuses to mix
  # version-pinned roots with branch-pinned transitive deps. The package
  # maintainer's own README uses `.branch("main")` for the same reason.
  Argon2Swift:
    url: https://github.com/tmthecoder/Argon2Swift.git
    branch: main

targets:
  nomily_ios:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
    resources:
      - path: Sources/Resources
    dependencies:
      - package: Argon2Swift
      # Embeds the watch app inside the iPhone app bundle, which is how a
      # watchOS companion ships — it can't be installed on its own.
      - target: nomily_watch
        embed: true
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: Nomily AI
        CFBundleShortVersionString: "1.0.0"
        # Must track `nomily_watch`'s build number — watchOS refuses to install
        # a companion whose version doesn't match its host, and an embedded
        # watch app one build ahead is enough to trip it. Bump both or neither.
        CFBundleVersion: "7"
        # Skip Apple's per-upload "Missing Compliance" prompt. `false` is
        # appropriate when the app's crypto use is exempt from US export
        # documentation requirements:
        #   - HTTPS via URLSession (Azure / OpenAI / etc.) — built-in to iOS
        #   - Keychain storage — built-in to iOS
        #   - ChaCha20 + Argon2id used solely to encrypt/decrypt the user's
        #     own audio recordings (digital media content) at rest on a
        #     paired device the user owns — covered by the "ancillary"
        #     mass-market exemption and the EAR digital-media-protection
        #     carve-out.
        # If your legal review concludes the use is non-exempt, flip this
        # to `true` and file an annual self-classification (ERN) at
        # https://snap.bis.doc.gov.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: AccentColor
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSBluetoothAlwaysUsageDescription: Nomily AI connects to your D·NOTE recorder over Bluetooth to list, transfer and transcribe recordings.
        NSLocalNetworkUsageDescription: Nomily AI opens a direct TCP connection to your D·NOTE over its Wi-Fi access point during Fast Transfer.
        NSMicrophoneUsageDescription: Live transcription monitors microphone state to coordinate with the device's stream.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIBackgroundModes:
          - audio
          - bluetooth-central
    entitlements:
      path: Sources/App/nomily_ios.entitlements
      properties:
        com.apple.developer.networking.HotspotConfiguration: true
        # ⛔ **Deliberately NOT including** `com.apple.security.application-groups` (removed 2026-10-12).
        #
        # Two independent reasons, either one is enough:
        #
        # ① **It cannot be registered, and it also breaks Hotspot.** App Group IDs are **globally unique across teams**;
        #    `group.com.nomily.app` is already taken by the earlier personal team `YW24F9VMC9` on this machine.
        #    A failed registration makes Xcode fall back to a wildcard profile as a whole (`96S46YT5TP.*` does not include Hotspot),
        #    so the error also gains the line "doesn't include the Hotspot capability" --
        #    that is only a **side symptom**; the real cause is the App Group. (§3.1 records this investigation.)
        #
        # ② **It changes the data directory, effectively "hiding" the existing library.**
        #    `StorageLocations.root` is "use the group container if available, otherwise fall back to the sandbox".
        #    This app has **never** obtained the group container (it has always been the sandbox),
        #    so once this entitlement actually takes effect, `root` would switch from the sandbox Documents to the group container,
        #    and the user's library / config would **look completely empty** (the data is still in the sandbox, just no longer read).
        #
        # ## It is not needed at all right now
        # It is only a hook left so that "future share / notification / audio extensions" can share one container.
        # The watch pipeline does **not depend** on it -- the watch uses `WatchConnectivity`,
        # and the source list of `nomily_watch` does not include `StorageLocations.swift`.
        #
        # ## If it is really added in the future
        # Use a **team-unique** ID (e.g. `group.com.nomily.app.96S46YT5TP`, which already exists on the portal),
        # **and** add a one-time migration in `StorageLocations` (group container empty while the sandbox has data
        # → copy over), otherwise you get exactly the "library looks empty" problem in ② above.
        # Never use `group.com.nomily.app` again -- it is held by another team.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nomily.app
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # ★ Added 2026-10-12: **write the signing config into the spec**, for two reasons
        #   ① This file is the input of `xcodegen generate`, and **every generation rebuilds the pbxproj**
        #      -- the Team / signing style picked by hand in the GUI gets wiped, so it has to be clicked again after every generation.
        #   ② The `xcodebuild` automatic-signing path (the preferred branch of `tools/install-device.sh`)
        #      also needs these two values; putting them here avoids passing them on the command line again.
        # ⚠️ Change here when switching team/account (`project-nodevice.yml` has a copy too; change both together).
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 96S46YT5TP

  nomily_watch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Watch
      # Compiled into both apps so the WatchConnectivity wire contract, the
      # clip-naming convention and the localized strings can't drift apart.
      - path: Sources/Services/Watch/WatchLinkMessage.swift
      # Shared so the Action Button intent exists on both sides: the iPhone
      # needs it to author the shortcut, the watch needs it to run one.
      - path: Sources/Services/Watch/RecordingIntent.swift
      - path: Sources/Services/Storage/RecordingName.swift
      - path: Sources/App/L10n.swift
      # Runtime language switching. Compiled into the watch too (2026-10-15) so
      # the wrist can offer its own language picker: the strings and the ten
      # `.lproj` folders were already along for the ride, but without this file
      # there was no way to point `NSLocalizedString` at anything other than the
      # watch's system language. Nothing iPhone-specific lives here — it's the
      # `Bundle` subclass plus the tag table.
      - path: Sources/Services/Localization/AppLanguage.swift
      - path: Sources/Resources
        buildPhase: resources
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Nomily AI
        CFBundleShortVersionString: "1.0.0"
        # Must track the iPhone app's build number — watchOS refuses to install
        # a companion whose version doesn't match its host.
        CFBundleVersion: "7"
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.nomily.app
        NSMicrophoneUsageDescription: Nomily AI records voice notes on your Apple Watch and syncs them to your iPhone.
        # Background audio on watchOS is UIBackgroundModes, same as iOS.
        # WKBackgroundModes is a different key — it names `WKExtendedRuntimeSession`
        # types (workout-processing, self-care, mindfulness, …) and does not
        # accept `audio`; WatchKit exports exactly one value symbol,
        # WKBackgroundModesWorkoutProcessingValue. Declaring an illegal value
        # there risks installd rejecting the bundle outright.
        UIBackgroundModes:
          - audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nomily.app.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        GENERATE_INFOPLIST_FILE: NO
        # Ship the watch app as a single binary. Xcode's Debug default splits
        # it into a stub + `.debug.dylib` + `__preview.dylib` for SwiftUI
        # previews (which this target doesn't use), and that layout has to
        # survive iOS handing the bundle to the watch — a path that reports
        # nothing but "This app could not be installed at this time" when it
        # doesn't. Not worth the risk for a feature we don't use.
        ENABLE_DEBUG_DYLIB: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # ★ 2026-10-12: together with `nomily_ios`, the signing config is written into the spec (reasons above).
        #   The watch needs a **different** watchOS profile (bundle id is
        #   `com.nomily.app.watchkitapp`, not `com.nomily.app`), but uses the **same team**.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 96S46YT5TP
